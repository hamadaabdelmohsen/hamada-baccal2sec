}

function logout(){localStorage.removeItem('studentName'); studentName=''; showHome();}

  for(const chapter in grouped){
    html+= `<div class="cb"><div class="ct"><span>📚</span> ${chapter}</div><div class="lg">`;
    grouped[chapter].forEach(lesson=>{
      const completed = JSON.parse(localStorage.getItem('completedLessons')||'[]').includes(lesson.id);
      html+= `<div class="lc" onclick="showLesson(${lesson.id})">
        <div class="ltop" style="background:linear-gradient(135deg,${lesson.c1},${lesson.c2})"><span class="lic">${lesson.icon}</span><span class="ln">${completed?'✅ مكتمل':'الدرس '+lesson.id}</span></div>
        <div class="lb"><h3>${lesson.title}</h3><p>${lesson.summary}</p><div class="lm"><span>📝 ${lesson.questions.length} أسئلة</span><span>⏱ 15 د</span></div><div class="la">ابدأ الدرس →</div></div>
      </div>`;
    });
    html+= `</div></div>`;
  }
  const completed = JSON.parse(localStorage.getItem('completedLessons')||'[]');
  html+= `<div class="sc" style="text-align:center;margin:30px 0"><h3>🎯 تقدمك</h3><p>أكملت ${completed.length} من ${lessons.length} درس</p><div style="background:#f1f5f9;height:12px;border-radius:999px;overflow:hidden;margin-top:8px"><div style="height:100%;width:${completed.length/lessons.length*100}%;background:linear-gradient(90deg,#7c3aed,#06b6d4,#f59e0b);transition:.6s"></div></div></div>`;
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}

function showLesson(id){
  const lesson = lessons.find(l=>l.id===id);
  currentLessonId = id;
  let html = `<div class="lh"><div class="lhbg" style="background:linear-gradient(135deg,${lesson.c1},${lesson.c2})"></div><div class="lhc">
    <div class="bc"><a href="#" onclick="showLessons();return false;">الدروس</a> / ${lesson.chapter}</div>
    <div class="lbadge"><span>${lesson.icon}</span> الدرس ${lesson.id} من ${lessons.length}</div>
    <h1>${lesson.title}</h1><p class="lch">${lesson.chapter}</p>
    <div class="wl">يا ${studentName}، هذا الدرس باسم: <strong>${lesson.title}</strong> - ركز جيداً فالأسئلة من تمارين الكتاب!</div>
    <div class="lo"><h4>🎯 أهداف الدرس</h4><ul>${lesson.objectives.map(o=>`<li>${o}</li>`).join('')}</ul></div>
  </div></div>
  <div class="lcont"><div>
  `;
  lesson.sections.forEach(sec=>{
    html+= `<div class="cs"><h2><span class="si">${sec.icon}</span> ${sec.title}</h2><p class="sb">${sec.body}</p><ul class="pl">${sec.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  });
  html+= `<div class="kt"><h3>📖 مصطلحات أساسية</h3><div class="terms">${lesson.terms.map(t=>`<span class="term">${t}</span>`).join('')}</div></div>`;
  html+= `<div class="qs" id="quiz"><div class="qh"><h2>📝 اختبر نفسك - 10 أسئلة من تمارين الكتاب</h2><p style="font-size:13px;color:#64748b">اختر الإجابة، وستظهر النتيجة فوراً: <span class="green">أخضر صحيح</span> و <span class="red">أحمر خطأ</span> مع الشرح</p><div class="qp"><div id="qpf" class="qpf"></div><span id="qs">0 / ${lesson.questions.length}</span></div></div>`;
  lesson.questions.forEach((q,i)=>{
    html+= `<div class="qc" data-qid="${i}" data-correct="${q.correct}"><div class="qn">سؤال ${i+1}</div><h3 class="qt">${q.q}</h3><div class="opts">`;
    q.opts.forEach((opt,oi)=>{
      html+= `<button class="ob" data-index="${oi}" onclick="checkAns(this,${i},${q.correct})"><span class="ol">${String.fromCharCode(1575+oi)}</span><span>${opt}</span><span class="or"></span></button>`;
    });
    html+= `</div><div class="exp" id="exp-${i}"><strong>💡 الشرح:</strong> ${q.exp}</div></div>`;
  });
  html+= `<div class="qr" id="qr"><h2>🎉 أحسنت يا ${studentName}!</h2><p>نتيجتك: <span id="fs"></span></p><div class="ra"><button class="btn btn-p" onclick="nextLesson()">الدرس التالي →</button><button class="btn btn-g" onclick="showLessons()">العودة للدروس</button><button class="btn btn-g" onclick="resetQuiz()">إعادة الاختبار</button></div></div>`;
  html+= `</div></div>`;
  html+= `<div><div class="sc sticky"><h4>📍 في هذا الدرس</h4><ul class="toc">${lesson.sections.map(s=>`<li>${s.title}</li>`).join('')}<li>📖 المصطلحات</li><li>📝 الاختبار (10 أسئلة)</li></ul><div><button class="btn btn-g btn-b" onclick="prevLesson()">← السابق</button><button class="btn btn-p btn-b" onclick="nextLesson()">التالي →</button><button class="btn btn-g btn-b" onclick="showLessons()">إنهاء المراجعة 🎓</button></div><div class="tip"><strong>💡 نصيحة للمذاكرة</strong><p>اقرأ الشرح مرة، ثم حل الأسئلة بدون رجوع. ثم راجع إجاباتك.</p></div></div></div></div>`;
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
  initQuiz();
}

let score=0; let answered=new Set();
function initQuiz(){score=0; answered=new Set(); updateQuizProgress();}
function updateQuizProgress(){document.getElementById('qs').innerText = score+' / '+lessons.find(l=>l.id===currentLessonId).questions.length; document.getElementById('qpf').style.width = (answered.size / lessons.find(l=>l.id===currentLessonId).questions.length *100)+'%';}
function checkAns(btn,qIndex,correctIndex){
  const card = btn.closest('.qc');
  if(card.classList.contains('ans')) return;
  card.classList.add('ans');
  const all = card.querySelectorAll('.ob');
  const chosen = parseInt(btn.dataset.index);
  all.forEach(b=>{
    const idx=parseInt(b.dataset.index);
    b.disabled=true;
    if(idx===correctIndex){b.classList.add('correct'); b.querySelector('.or').innerText='✓ صحيح';}
    else if(idx===chosen){b.classList.add('wrong'); b.querySelector('.or').innerText='✗ خطأ';}
  });
  document.getElementById('exp-'+qIndex).classList.add('show');
  if(chosen===correctIndex) score++;
  answered.add(qIndex);
  updateQuizProgress();
  if(answered.size===lessons.find(l=>l.id===currentLessonId).questions.length){
    setTimeout(showResult,600);
  }
}
function showResult(){
  const total = lessons.find(l=>l.id===currentLessonId).questions.length;
  document.getElementById('fs').innerText = score+' من '+total+' ('+Math.round(score/total*100)+'%)';
  document.getElementById('qr').classList.add('show');
  document.getElementById('qr').scrollIntoView({behavior:'smooth'});
  let completed = JSON.parse(localStorage.getItem('completedLessons')||'[]');
  if(!completed.includes(currentLessonId)){completed.push(currentLessonId); localStorage.setItem('completedLessons', JSON.stringify(completed));}
  localStorage.setItem('score_'+currentLessonId, score);
}
function resetQuiz(){document.querySelectorAll('.qc').forEach(c=>{c.classList.remove('ans'); c.querySelectorAll('.ob').forEach(b=>{b.classList.remove('correct','wrong'); b.disabled=false; b.querySelector('.or').innerText='';}); c.querySelector('.exp').classList.remove('show');}); initQuiz(); document.getElementById('qr').classList.remove('show'); document.getElementById('quiz').scrollIntoView({behavior:'smooth'});}
function nextLesson(){const idx = lessons.findIndex(l=>l.id===currentLessonId); if(idx < lessons.length-1) showLesson(lessons[idx+1].id); else showLessons();}
function prevLesson(){const idx = lessons.findIndex(l=>l.id===currentLessonId); if(idx>0) showLesson(lessons[idx-1].id); else showLessons();}

// init
if(studentName) showLessons(); else showHome();
</script>
</body>
</html>
