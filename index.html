    <div class="card" style="max-width:400px"><label style="font-weight:700;font-size:13px;display:block;margin-bottom:8px">اكتب اسمك لتبدأ</label><input id="nameIn" placeholder="مثال: أحمد محمد" onkeydown="if(event.key==='Enter')start()"><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="start()">ابدأ المذاكرة ✨</button></div>
  </div>`;
  updateBadge();
}
function updateBadge(){
  const b=document.getElementById('userBadge');
  if(student) b.innerHTML=`<span class="badge">👋 ${student}</span> <button class="btn btn-secondary" style="padding:4px 10px;font-size:11px" onclick="logout()">خروج</button>`;
  else b.innerHTML='';
}
function logout(){localStorage.removeItem('student'); student=''; showWelcome();}
function start(){
  const v=document.getElementById('nameIn').value.trim();
  if(!v){alert('أدخل اسمك');return;}
  student=v; localStorage.setItem('student',student);
  showLessons();
}
function showLessons(){
  updateBadge();
  let html=`<div style="padding:16px 0"><h2 style="text-align:center">أهلاً يا <span style="background:#fef3c7;padding:2px 8px;border-radius:6px">${student}</span> 👋</h2><p style="text-align:center;color:#64748b;font-size:13px">اختر درساً - كل درس 10 أسئلة من الكتاب</p></div>`;
  const groups={};
  lessons.forEach(l=>{if(!groups[l.chapter]) groups[l.chapter]=[]; groups[l.chapter].push(l);});
  for(const ch in groups){
    html+=`<div style="margin:20px 0"><div style="background:#fff;border:1px solid #e2e8f0;display:inline-block;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px;margin-bottom:8px">📚 ${ch}</div><div class="lesson-grid">`;
    groups[ch].forEach(ls=>{
      const done=(JSON.parse(localStorage.getItem('done')||'[]')).includes(ls.id);
      html+=`<div class="lesson-card" onclick="openLesson(${ls.id})"><div class="lesson-top" style="background:linear-gradient(135deg,${ls.c1},${ls.c2})"><span style="font-size:20px">${ls.icon}</span><span style="background:rgba(0,0,0,.2);padding:2px 8px;border-radius:10px;font-size:10px">${done?'✅ مكتمل':'الدرس '+ls.id}</span></div><div class="lesson-body"><h3 style="font-size:14px;margin-bottom:6px">${ls.title}</h3><p style="font-size:11px;color:#64748b;margin-bottom:8px">${ls.summary}</p><div style="font-size:10px;color:#64748b">📝 ${ls.questions.length} أسئلة</div></div></div>`;
    });
    html+=`</div></div>`;
  }
  const done=JSON.parse(localStorage.getItem('done')||'[]');
  html+=`<div class="card" style="text-align:center;margin-top:20px"><h4>📊 تقدمك</h4><p style="font-size:13px;color:#64748b">أكملت ${done.length} من ${lessons.length} درس</p><div class="progress-bar"><div class="progress-fill" style="width:${done.length/lessons.length*100}%"></div></div></div>`;
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
}
function openLesson(id){
  const ls=lessons.find(x=>x.id===id); curId=id; score=0; answered=new Set();
  let html=`<div style="margin:16px 0"><a href="#" onclick="showLessons();return false" style="color:#7c3aed;text-decoration:none;font-size:13px">← العودة للدروس</a></div>`;
  html+=`<div class="card" style="background:linear-gradient(135deg,${ls.c1},${ls.c2});color:#fff;border:none"><div style="font-size:12px;opacity:.9">${ls.chapter}</div><h1 style="font-size:20px;margin:8px 0">${ls.icon} ${ls.title}</h1><p style="opacity:.9;font-size:12px">${ls.summary}</p></div>`;
  html+=`<div class="card"><h3>📘 الشرح المبسط</h3><p style="font-size:13px;color:#334155;margin:8px 0">${ls.content}</p></div>`;
  html+=`<div class="card"><h3>📝 اختبر نفسك - 10 أسئلة</h3><p style="font-size:11px;color:#64748b">الصحيح <span style="color:#10b981;font-weight:800">أخضر</span> والخطأ <span style="color:#ef4444;font-weight:800">أحمر</span></p><div class="progress-bar"><div id="prog" class="progress-fill" style="width:0%"></div></div><div style="font-size:11px;margin-top:4px"><span id="scoreTxt">0 / ${ls.questions.length}</span></div>`;
  ls.questions.forEach((q,i)=>{
    html+=`<div class="question-card" id="qc-${i}"><div style="background:#0f172a;color:#fff;display:inline-block;padding:2px 6px;border-radius:10px;font-size:10px">سؤال ${i+1}</div><p style="font-weight:700;margin:8px 0;font-size:14px">${q.q}</p>`;
    q.opts.forEach((o,oi)=>{
      html+=`<button class="opt-btn" onclick="check(this,${i},${q.c})" data-i="${oi}"><span style="background:#f1f5f9;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;font-weight:700;font-size:11px">${String.fromCharCode(1575+oi)}</span><span style="flex:1;font-size:13px">${o}</span><span class="res" style="font-size:11px;font-weight:700"></span></button>`;
    });
    html+=`<div class="explain" id="ex-${i}">💡 ${q.e}</div></div>`;
  });
  html+=`<div class="result-box" id="resultBox"><h3>🎉 أحسنت يا ${student}!</h3><p style="margin:8px 0">نتيجتك: <strong id="finalScore"></strong></p><button class="btn btn-primary" onclick="nextLesson()">التالي →</button> <button class="btn btn-secondary" onclick="showLessons()">الدروس</button></div></div>`;
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
}
function check(btn, qIdx, correct){
  const card=document.getElementById('qc-'+qIdx);
  if(card.dataset.done==='1') return;
  card.dataset.done='1';
  const opts=card.querySelectorAll('.opt-btn');
  const chosen=parseInt(btn.dataset.i);
  opts.forEach(b=>{
    const ii=parseInt(b.dataset.i);
    b.disabled=true;
    if(ii===correct){b.classList.add('correct'); b.querySelector('.res').innerText='✓';}
    else if(ii===chosen){b.classList.add('wrong'); b.querySelector('.res').innerText='✗';}
  });
  document.getElementById('ex-'+qIdx).classList.add('show');
  if(chosen===correct) score++;
  answered.add(qIdx);
  document.getElementById('scoreTxt').innerText=score+' / '+lessons.find(l=>l.id===curId).questions.length;
  document.getElementById('prog').style.width=(answered.size / lessons.find(l=>l.id===curId).questions.length *100)+'%';
  if(answered.size===lessons.find(l=>l.id===curId).questions.length){
    setTimeout(()=>{
      document.getElementById('finalScore').innerText=score+' من '+lessons.find(l=>l.id===curId).questions.length+' ('+Math.round(score/lessons.find(l=>l.id===curId).questions.length*100)+'%)';
      document.getElementById('resultBox').classList.add('show');
      let done=JSON.parse(localStorage.getItem('done')||'[]');
      if(!done.includes(curId)){done.push(curId); localStorage.setItem('done',JSON.stringify(done));}
      document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
    },400);
  }
}
function nextLesson(){const i=lessons.findIndex(l=>l.id===curId); if(i<lessons.length-1) openLesson(lessons[i+1].id); else showLessons();}
if(student) showLessons(); else showWelcome();
</script>
</body>
</html>
